# Generated by the Create cluster workflow (cluster/cluster-templates/cilium.yaml, git-ignored); see .github/workflows/create_cluster.yaml.
# Validate: omnictl cluster template validate -f cluster/cluster-templates/cluster-template.yaml
# Create:   omnictl cluster template sync -f cluster/cluster-templates/cluster-template.yaml
kind: Cluster
name: prod
kubernetes:
  version: v1.36.3
  manifests:
    # Generated by the Create cluster workflow from platform/cilium/ (not committed). Applied once by Omni
    # when the cluster is healthy; Argo CD takes over afterwards.
    - name: cilium
      file: cilium.yaml
      mode: one-time
talos:
  version: v1.13.12
patches:
  # Cilium replaces the default CNI and kube-proxy.
  - name: no-cni
    file: patches/no-cni.yaml
---
kind: ControlPlane
machineClass:
  name: talos-control-plane
  size: 3
---
kind: Workers
machineClass:
  name: talos-worker
  size: 3
