metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: talos-worker
spec:
  autoprovision:
    providerid: proxmox
    providerdata: |
      cores: 4
      sockets: 1
      memory: 4096
      disk_size: 10
      storage_selector: 'name == "vm-pool"'
      network_bridge: vmbr0
      cpu_type: x86-64-v3
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      placement_strategy: spread